<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>思い出の覗き込み3Dフォト＆ビデオステージ（ステレオサウンド版）</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #090314;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(18, 10, 42, 0.88);
      padding: 16px 20px;
      border-radius: 14px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(244, 114, 182, 0.45);
      width: calc(100% - 32px);
      max-width: 380px;
      box-sizing: border-box;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      transition: opacity 0.3s;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
    }
    #ui.minimized {
      padding: 10px 14px;
      width: auto;
      overflow: visible;
    }
    #ui.minimized .panel-body {
      display: none;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    #ui.minimized .header-row {
      margin-bottom: 0;
    }
    #ui h1 {
      margin: 0;
      font-size: 15px;
      color: #f472b6;
    }
    .toggle-btn {
      background: rgba(255,255,255,0.12);
      border: none;
      color: #cbd5e1;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
      width: auto;
      flex-shrink: 0;
    }
    .drop-zone {
      background: rgba(244, 114, 182, 0.14);
      border: 1.5px dashed #f472b6;
      border-radius: 10px;
      padding: 12px;
      font-size: 12px;
      margin-bottom: 10px;
      color: #fce7f3;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s;
    }
    .drop-zone:hover {
      background: rgba(244, 114, 182, 0.25);
    }
    .gdrive-box {
      background: rgba(255,255,255,0.06);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .gdrive-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .gas-toggle-link {
      font-size: 10.5px;
      color: #94a3b8;
      text-decoration: underline;
      cursor: pointer;
    }
    .gas-toggle-link:hover {
      color: #38bdf8;
    }
    .gdrive-input {
      width: 100%;
      padding: 7px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-size: 11.5px;
      margin-bottom: 6px;
      box-sizing: border-box;
    }
    .gdrive-input::placeholder {
      color: #94a3b8;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    button.primary {
      background: linear-gradient(135deg, #ec4899, #8b5cf6, #06b6d4);
      color: #fff;
      border: none;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button.secondary {
      background: rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 9px 8px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
    }
    button.secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    button.record-btn {
      background: linear-gradient(135deg, #ef4444, #f97316);
      color: #fff;
      border: none;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
    }
    button.record-btn.recording {
      background: #dc2626;
      animation: pulse-rec 1.2s infinite;
    }
    @keyframes pulse-rec {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      50% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #status {
      font-size: 11.5px;
      color: #fde047;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .hint-small {
      font-size: 11px;
      color: #cbd5e1;
      margin-top: 6px;
      line-height: 1.4;
    }
    #video-preview {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 130px;
      height: 98px;
      border-radius: 10px;
      border: 2px solid rgba(244, 114, 182, 0.5);
      transform: scaleX(-1);
      object-fit: cover;
      z-index: 10;
      display: none;
    }
    #frame-border {
      position: fixed;
      inset: 0;
      border: 10px solid #000;
      pointer-events: none;
      z-index: 5;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.95);
    }
    #rec-badge {
      position: fixed;
      top: 18px;
      right: 20px;
      background: rgba(220, 38, 38, 0.92);
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      z-index: 20;
      display: none;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(220, 38, 38, 0.5);
    }
    #rec-dot {
      width: 8px;
      height: 8px;
      background: #fff;
      border-radius: 50%;
      animation: pulse-rec 1s infinite;
    }
    input[type="file"] {
      display: none;
    }
    @media (max-width: 600px) {
      #frame-border { border-width: 6px; }
      #ui { top: 10px; left: 10px; width: calc(100% - 20px); padding: 12px 14px; }
      #video-preview { width: 96px; height: 72px; bottom: 10px; right: 10px; }
    }
  </style>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- MediaPipe FaceMesh & SelfieSegmentation -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="frame-border"></div>
  <div id="rec-badge"><span id="rec-dot"></span><span id="rec-timer">自動ループ録画中 5.0s</span></div>

  <div id="ui">
    <div class="header-row">
      <h1>🎓 3D 写真＆動画ステージ</h1>
      <button class="toggle-btn" id="toggle-ui">隠す</button>
    </div>
    <div class="panel-body">
      <div class="drop-zone" id="drop-zone">
        📸🎞 <b>写真や動画をここにドロップ</b><br>
        （複数枚 / MP4・WebM対応）<br>
        <span style="font-size:11px; color:#fbcfe8;">※左右のステレオ感＆全画面比率に対応！</span>
      </div>
      <input type="file" id="file-input" accept="image/*,video/mp4,video/webm,video/ogg" multiple>

      <!-- Googleドライブ連携用UI（GUI完結・自動保存対応） -->
      <div class="gdrive-box">
        <div class="gdrive-header">
          <span style="font-size: 11.5px; color:#38bdf8; font-weight: 600;">🌐 Googleドライブから一括読込</span>
          <span class="gas-toggle-link" id="toggle-gas-config">⚙ GAS URL設定</span>
        </div>
        <div id="gas-config-area" style="margin-bottom: 4px;">
          <input type="text" id="gas-url-input" class="gdrive-input" placeholder="GASのウェブアプリURL (https://script.google.com/...)" style="border-color: rgba(244, 114, 182, 0.45);">
        </div>
        <input type="text" id="gdrive-id-input" class="gdrive-input" placeholder="ドライブのフォルダURL または ID を貼り付け">
        <button class="secondary" id="gdrive-load-btn" style="width: 100%; border-color: rgba(56, 189, 248, 0.4);">📁 ドライブから読み込む</button>
      </div>

      <div class="btn-row">
        <button class="secondary" id="bg-btn">🖼 背景変更</button>
        <button class="secondary" id="replay-btn">🔄 再配置</button>
        <button class="secondary" id="audio-toggle-btn">🔊 サウンド: ON</button>
        <input type="file" id="bg-input" accept="image/*">
      </div>

      <!-- スピード調整スライダーUI -->
      <div style="background: rgba(255,255,255,0.06); padding: 10px; border-radius: 8px; margin-bottom: 10px;">
        <div style="display: flex; justify-content: space-between; font-size: 11.5px; margin-bottom: 4px;">
          <span>🚀 進むスピード: <strong id="speed-val" style="color:#f472b6;">11.0</strong></span>
          <span style="cursor:pointer; color:#38bdf8;" id="speed-reset">標準に戻す</span>
        </div>
        <input type="range" id="speed-slider" min="2" max="30" step="0.5" value="11" style="width: 100%; accent-color: #ec4899; cursor: pointer;">
      </div>

      <div class="btn-row">
        <button class="record-btn" id="record-btn">🎬 5秒ループ動画を自動書出</button>
      </div>

      <div id="status">サンプル表示中：ステレオサウンド＆縦横比最適化対応！</div>
      <button class="primary" id="start-btn">カメラを起動して覗き込む</button>
      <div class="hint-small">
        ・横画面(16:9)・縦画面(9:16)・正方形など画面比率に自動最適化します。
      </div>
    </div>
  </div>

  <video id="video-preview" autoplay playsinline></video>

  <script>
    // --- UIパネル開閉 ---
    const uiEl = document.getElementById('ui');
    const toggleBtn = document.getElementById('toggle-ui');
    toggleBtn.addEventListener('click', () => {
      uiEl.classList.toggle('minimized');
      toggleBtn.textContent = uiEl.classList.contains('minimized') ? '設定' : '隠す';
    });

    // --- 1. 3Dシーン・ネオン空間の構築 ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x09021c);
    scene.fog = new THREE.FogExp2(0x110533, 0.013);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 160);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    function computeScreenMetrics() {
      const aspect = Math.max(0.25, window.innerWidth / Math.max(1, window.innerHeight));
      const h = aspect >= 1 ? 10 : Math.min(13.5, 10 / Math.pow(aspect, 0.32));
      const w = h * aspect;
      return { width: w, height: h, aspect };
    }

    let metrics = computeScreenMetrics();
    let screenWidth = metrics.width;
    let screenHeight = metrics.height;

    const TUNNEL_LENGTH = 80;
    const GRID_TILE_Z = TUNNEL_LENGTH / 16;
    const RING_COUNT = 11;
    const RING_SPAN = RING_COUNT * GRID_TILE_Z;

    function createVibrantTexture(c1, c2, c3, drawGrid = true) {
      const c = document.createElement('canvas');
      c.width = 512;
      c.height = 512;
      const ctx = c.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 512, 512);
      grad.addColorStop(0, c1);
      grad.addColorStop(0.5, c2);
      grad.addColorStop(1, c3);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      if (drawGrid) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.lineWidth = 4;
        const step = 64;
        for (let i = 0; i <= 512; i += step) {
          ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
        }
      } else {
        ctx.save();
        ctx.translate(256, 256);
        for (let i = 0; i < 36; i++) {
          ctx.rotate((Math.PI * 2) / 36);
          ctx.fillStyle = i % 2 === 0 ? 'rgba(255, 255, 255, 0.22)' : 'rgba(253, 224, 71, 0.18)';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(-24, 420);
          ctx.lineTo(24, 420);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      if (drawGrid) tex.repeat.set(4, 16);
      return tex;
    }

    const wallTex = createVibrantTexture('#4c1d95', '#db2777', '#2563eb', true);
    const floorTex = createVibrantTexture('#0f172a', '#7c3aed', '#ec4899', true);
    const defaultBackTex = createVibrantTexture('#ec4899', '#8b5cf6', '#06b6d4', false);
    let isCustomBgImage = false;

    // --- Web Audio API によるステレオ（左右パン）管理 ---
    let globalAudioEnabled = true;
    let audioCtx = null;
    const activeVideoAudioNodes = [];

    const audioToggleBtn = document.getElementById('audio-toggle-btn');
    audioToggleBtn.addEventListener('click', () => {
      globalAudioEnabled = !globalAudioEnabled;
      audioToggleBtn.textContent = globalAudioEnabled ? "🔊 サウンド: ON" : "🔇 サウンド: OFF";
      audioToggleBtn.style.background = globalAudioEnabled ? 'rgba(255, 255, 255, 0.12)' : 'rgba(239, 68, 68, 0.3)';

      if (audioCtx && audioCtx.state === 'suspended' && globalAudioEnabled) {
        audioCtx.resume();
      }
      updateAllAudioVolumes();
    });

    function initAudioContextIfNeeded() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function updateAllAudioVolumes() {
      const targetVol = globalAudioEnabled ? 1.0 : 0.0;
      for (const item of activeVideoAudioNodes) {
        if (item.gainNode) {
          item.gainNode.gain.setValueAtTime(targetVol, audioCtx ? audioCtx.currentTime : 0);
        }
      }
    }

    const tunnelSegments = [];
    const SEGMENT_COUNT = 3;
    for (let s = 0; s < SEGMENT_COUNT; s++) {
      const segGroup = new THREE.Group();

      const floorMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(1, 1),
        new THREE.MeshBasicMaterial({ map: floorTex, side: THREE.DoubleSide })
      );
      floorMesh.rotation.x = -Math.PI / 2;

      const ceilMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(1, 1),
        new THREE.MeshBasicMaterial({ map: floorTex, side: THREE.DoubleSide })
      );
      ceilMesh.rotation.x = Math.PI / 2;

      const leftMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(1, 1),
        new THREE.MeshBasicMaterial({ map: wallTex, side: THREE.DoubleSide })
      );
      leftMesh.rotation.y = Math.PI / 2;

      const rightMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(1, 1),
        new THREE.MeshBasicMaterial({ map: wallTex, side: THREE.DoubleSide })
      );
      rightMesh.rotation.y = -Math.PI / 2;

      segGroup.userData = { floorMesh, ceilMesh, leftMesh, rightMesh };
      segGroup.add(floorMesh, ceilMesh, leftMesh, rightMesh);
      segGroup.position.z = -s * TUNNEL_LENGTH;
      scene.add(segGroup);
      tunnelSegments.push(segGroup);
    }

    const speedRings = [];
    for (let i = 0; i < RING_COUNT; i++) {
      const ringGeo = new THREE.EdgesGeometry(new THREE.PlaneGeometry(1, 1));
      const ringColor = [0xff4db8, 0x38bdf8, 0xfde047, 0xc084fc, 0x34d399][i % 5];
      const ringMat = new THREE.LineBasicMaterial({ color: ringColor });
      const ring = new THREE.LineSegments(ringGeo, ringMat);
      ring.userData.worldZ = -i * (RING_SPAN / RING_COUNT);
      scene.add(ring);
      speedRings.push(ring);
    }

    const backWall = new THREE.Mesh(
      new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({ map: defaultBackTex, side: THREE.DoubleSide })
    );
    scene.add(backWall);

    // 紙吹雪（Confetti）パーティクルの生成（常時リッチ＆舞い散る動き付き）
    function createConfettiTexture() {
      const c = document.createElement('canvas');
      c.width = 64;
      c.height = 64;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(12, 18, 40, 28, 6);
      ctx.fill();
      return new THREE.CanvasTexture(c);
    }

    const particleCount = 1500;
    const pGeo = new THREE.BufferGeometry();
    const pPositions = new Float32Array(particleCount * 3);
    const pColors = new Float32Array(particleCount * 3);
    const pPhases = new Float32Array(particleCount);
    const palette = [
      new THREE.Color(0xff4db8),
      new THREE.Color(0x38bdf8),
      new THREE.Color(0xfde047),
      new THREE.Color(0xc084fc),
      new THREE.Color(0x34d399),
      new THREE.Color(0xffffff)
    ];

    for (let i = 0; i < particleCount; i++) {
      pPositions[i * 3] = (Math.random() - 0.5) * screenWidth * 1.6;
      pPositions[i * 3 + 1] = (Math.random() - 0.5) * screenHeight * 1.25;
      pPositions[i * 3 + 2] = 14 - Math.random() * 75;
      pPhases[i] = Math.random() * Math.PI * 2;

      const col = palette[i % palette.length];
      pColors[i * 3] = col.r;
      pColors[i * 3 + 1] = col.g;
      pColors[i * 3 + 2] = col.b;
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
    pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));
    const pMat = new THREE.PointsMaterial({
      size: 0.65,
      map: createConfettiTexture(),
      alphaTest: 0.2,
      vertexColors: true,
      transparent: true,
      opacity: 1.0
    });
    const particles = new THREE.Points(pGeo, pMat);
    particles.frustumCulled = false;
    scene.add(particles);

    function updateEnvironmentGeometry() {
      const w = screenWidth * 1.6;
      const h = screenHeight * 1.25;

      const repeatX = Math.max(2, Math.round((w / 5.0)));
      const repeatYWall = Math.max(2, Math.round((h / 5.0)));
      floorTex.repeat.set(repeatX, 16);
      wallTex.repeat.set(16, repeatYWall);

      for (const segGroup of tunnelSegments) {
        const { floorMesh, ceilMesh, leftMesh, rightMesh } = segGroup.userData;

        floorMesh.geometry.dispose();
        floorMesh.geometry = new THREE.PlaneGeometry(w, TUNNEL_LENGTH);
        floorMesh.position.set(0, -h / 2, -TUNNEL_LENGTH / 2);

        ceilMesh.geometry.dispose();
        ceilMesh.geometry = new THREE.PlaneGeometry(w, TUNNEL_LENGTH);
        ceilMesh.position.set(0, h / 2, -TUNNEL_LENGTH / 2);

        leftMesh.geometry.dispose();
        leftMesh.geometry = new THREE.PlaneGeometry(TUNNEL_LENGTH, h);
        leftMesh.position.set(-w / 2, 0, -TUNNEL_LENGTH / 2);

        rightMesh.geometry.dispose();
        rightMesh.geometry = new THREE.PlaneGeometry(TUNNEL_LENGTH, h);
        rightMesh.position.set(w / 2, 0, -TUNNEL_LENGTH / 2);
      }

      const rw = screenWidth * 1.3;
      const rh = screenHeight * 1.05;
      for (const ring of speedRings) {
        ring.geometry.dispose();
        ring.geometry = new THREE.EdgesGeometry(new THREE.PlaneGeometry(rw, rh));
      }

      const backSize = Math.max(screenWidth, screenHeight) * 9.5;
      backWall.geometry.dispose();
      backWall.geometry = new THREE.PlaneGeometry(backSize, backSize);
    }

    function resetEnvironmentPositions(baseZ = 0) {
      for (let s = 0; s < tunnelSegments.length; s++) {
        tunnelSegments[s].position.z = baseZ - s * TUNNEL_LENGTH;
      }
      for (let i = 0; i < speedRings.length; i++) {
        speedRings[i].userData.worldZ = baseZ - i * (RING_SPAN / RING_COUNT);
        speedRings[i].position.set(0, 0, speedRings[i].userData.worldZ);
      }
      const posAttr = pGeo.attributes.position;
      for (let i = 0; i < particleCount; i++) {
        posAttr.setX(i, (Math.random() - 0.5) * screenWidth * 1.6);
        posAttr.setY(i, (Math.random() - 0.5) * screenHeight * 1.25);
        posAttr.setZ(i, baseZ + 14 - Math.random() * 75);
      }
      posAttr.needsUpdate = true;
      backWall.position.z = baseZ - 75;
    }

    updateEnvironmentGeometry();
    resetEnvironmentPositions(0);

    // --- 2. AI人物切り抜き（SelfieSegmentation） ---
    const statusEl = document.getElementById('status');
    let segmentationModel = null;
    let isSegReady = false;

    async function initSegmentation() {
      segmentationModel = new SelfieSegmentation({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
      });
      segmentationModel.setOptions({ modelSelection: 1 });
      await segmentationModel.initialize();
      isSegReady = true;
    }
    initSegmentation().catch(e => console.warn("Segmentation init warning:", e));

    function extractPersonTexture(imgElement) {
      return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        const maxDim = 800;
        let w = imgElement.naturalWidth || imgElement.width;
        let h = imgElement.naturalHeight || imgElement.height;
        if (w > maxDim || h > maxDim) {
          const ratio = Math.min(maxDim / w, maxDim / h);
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        }
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');

        ctx.drawImage(imgElement, 0, 0, w, h);
        const imgData = ctx.getImageData(0, 0, w, h).data;
        let hasAlpha = false;
        for (let i = 3; i < imgData.length; i += 40) {
          if (imgData[i] < 250) { hasAlpha = true; break; }
        }

        if (hasAlpha || !isSegReady) {
          const tex = new THREE.CanvasTexture(canvas);
          resolve({ type: 'image', texture: tex, aspect: w / h });
          return;
        }

        segmentationModel.onResults((results) => {
          ctx.save();
          ctx.clearRect(0, 0, w, h);
          ctx.drawImage(results.segmentationMask, 0, 0, w, h);
          ctx.globalCompositeOperation = 'source-in';
          ctx.drawImage(results.image, 0, 0, w, h);
          ctx.restore();

          const tex = new THREE.CanvasTexture(canvas);
          resolve({ type: 'image', texture: tex, aspect: w / h });
        });

        segmentationModel.send({ image: canvas });
      });
    }

    // --- 3. アセット管理 ---
    const mediaPool = [];
    const activeCutouts = [];
    const MAX_PEOPLE_ON_SCREEN = 64;
    const SPAWN_DEPTH_START = 8;
    const SPAWN_DEPTH_END = 56;
    const SLICE_SPACING = (SPAWN_DEPTH_END - SPAWN_DEPTH_START) / MAX_PEOPLE_ON_SCREEN;

    function createSampleSilhouette(color, label) {
      const c = document.createElement('canvas');
      c.width = 300;
      c.height = 420;
      const ctx = c.getContext('2d');
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(150, 100, 52, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.roundRect(75, 165, 150, 240, 40);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(label, 150, 260);
      ctx.font = '15px sans-serif';
      ctx.fillText('写真や動画をドロップ', 150, 295);
      return { type: 'image', texture: new THREE.CanvasTexture(c), aspect: 300 / 420 };
    }

    const sampleAssets = [
      createSampleSilhouette('#ec4899', 'Member A'),
      createSampleSilhouette('#38bdf8', 'Member B'),
      createSampleSilhouette('#a855f7', 'Member C'),
      createSampleSilhouette('#10b981', 'Member D')
    ];

    let spawnIndex = 0;
    let travelZ = 0;
    let furthestSpawnZ = -SPAWN_DEPTH_START;

    const speedSlider = document.getElementById('speed-slider');
    const speedValEl = document.getElementById('speed-val');

    function computeUniformCorridorSpot(direction, width, height, worldZ) {
      const spanX = screenWidth * 0.68;
      const spanY = screenHeight * 0.56;
      const safeMarginX = Math.max(0.2, spanX - width * 0.42);
      const safeMarginY = Math.max(0.2, spanY - height * 0.42);

      let bestTarget = new THREE.Vector3();
      let bestMinDist = -1;
      let rotZ = 0;

      if (direction === 0) rotZ = (Math.random() - 0.5) * 0.14;
      else if (direction === 1) rotZ = -0.14 + (Math.random() - 0.5) * 0.1;
      else if (direction === 2) rotZ = 0.14 + (Math.random() - 0.5) * 0.1;
      else rotZ = Math.PI + (Math.random() - 0.5) * 0.14;

      for (let attempt = 0; attempt < 20; attempt++) {
        let cx = 0;
        let cy = 0;

        if (direction === 0) {
          cx = (Math.random() - 0.5) * 2 * safeMarginX;
          cy = -safeMarginY + (Math.random() - 0.5) * 0.5;
        } else if (direction === 1) {
          cx = -safeMarginX + Math.random() * (safeMarginX * 0.55);
          cy = (Math.random() - 0.5) * 2 * (safeMarginY * 0.8);
        } else if (direction === 2) {
          cx = safeMarginX - Math.random() * (safeMarginX * 0.55);
          cy = (Math.random() - 0.5) * 2 * (safeMarginY * 0.8);
        } else {
          cx = (Math.random() - 0.5) * 2 * safeMarginX;
          cy = safeMarginY + (Math.random() - 0.5) * 0.5;
        }

        const candidate = new THREE.Vector3(cx, cy, worldZ);

        if (activeCutouts.length === 0) {
          bestTarget.copy(candidate);
          break;
        }

        let minDist = Infinity;
        for (const existing of activeCutouts) {
          const dz = candidate.z - existing.targetPos.z;
          if (Math.abs(dz) > 18) continue;

          const dx = candidate.x - existing.targetPos.x;
          const dy = candidate.y - existing.targetPos.y;
          const d = Math.hypot(dx, dy, dz * 0.75);
          if (d < minDist) minDist = d;
        }

        if (minDist > bestMinDist) {
          bestMinDist = minDist;
          bestTarget.copy(candidate);
        }
      }

      const startPos = bestTarget.clone();
      if (direction === 0) startPos.y = -spanY - height * 1.2;
      else if (direction === 1) startPos.x = -spanX - width * 1.4;
      else if (direction === 2) startPos.x = spanX + width * 1.4;
      else startPos.y = spanY + height * 1.2;

      return { startPos, targetPos: bestTarget, rotZ };
    }

    function setupVideoAudio(videoElement) {
      if (!audioCtx) return null;
      try {
        const sourceNode = audioCtx.createMediaElementSource(videoElement);
        const pannerNode = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
        const gainNode = audioCtx.createGain();

        gainNode.gain.value = globalAudioEnabled ? 1.0 : 0.0;

        if (pannerNode) {
          sourceNode.connect(pannerNode);
          pannerNode.connect(gainNode);
        } else {
          sourceNode.connect(gainNode);
        }
        gainNode.connect(audioCtx.destination);

        const audioInfo = { sourceNode, pannerNode, gainNode };
        activeVideoAudioNodes.push(audioInfo);
        return audioInfo;
      } catch (e) {
        return null;
      }
    }

    function computeAssetDimensions(itemAspect, variantIndex) {
      const maxAssetW = screenWidth * 0.54;
      const maxAssetH = screenHeight * 0.48;
      let height = screenHeight * (0.38 + (variantIndex % 3) * 0.025);
      let width = height * itemAspect;

      if (width > maxAssetW) {
        width = maxAssetW;
        height = width / itemAspect;
      }
      if (height > maxAssetH) {
        height = maxAssetH;
        width = height * itemAspect;
      }
      return { width, height };
    }

    function spawnAssetAtWorldZ(worldZ, immediate = false) {
      const pool = mediaPool.length > 0 ? mediaPool : sampleAssets;
      const item = pool[spawnIndex % pool.length];
      const direction = spawnIndex % 4;
      spawnIndex++;

      const { width, height } = computeAssetDimensions(item.aspect, spawnIndex);

      const geo = new THREE.PlaneGeometry(width, height);
      let mat;
      let audioInfo = null;

      if (item.type === 'video') {
        mat = new THREE.MeshBasicMaterial({
          map: item.texture,
          side: THREE.DoubleSide
        });
      } else {
        mat = new THREE.MeshBasicMaterial({
          map: item.texture,
          transparent: true,
          alphaTest: 0.15,
          side: THREE.DoubleSide
        });
      }

      const mesh = new THREE.Mesh(geo, mat);
      const { startPos, targetPos, rotZ } = computeUniformCorridorSpot(direction, width, height, worldZ);

      mesh.position.copy(immediate ? targetPos : startPos);
      mesh.rotation.z = rotZ;

      if (item.type === 'video' && item.element) {
        initAudioContextIfNeeded();
        audioInfo = setupVideoAudio(item.element);
        item.element.play().catch(() => {});
      }

      scene.add(mesh);

      activeCutouts.push({
        mesh,
        targetPos,
        phase: immediate ? 'staying' : 'entering',
        audioInfo
      });
    }

    function populateInitialCorridor() {
      for (const item of activeCutouts) {
        if (item.audioInfo) {
          try {
            item.audioInfo.sourceNode.disconnect();
          } catch(e) {}
        }
        scene.remove(item.mesh);
        item.mesh.geometry.dispose();
        item.mesh.material.dispose();
      }
      activeCutouts.length = 0;
      activeVideoAudioNodes.length = 0;
      spawnIndex = 0;

      for (let i = 0; i < MAX_PEOPLE_ON_SCREEN; i++) {
        const z = travelZ - SPAWN_DEPTH_START - i * SLICE_SPACING;
        furthestSpawnZ = z;
        spawnAssetAtWorldZ(z, i < 20);
      }

      // 読込完了時にカメラ手前〜奥の紙吹雪を現在の travelZ 基準で即時再配置
      if (pGeo && pGeo.attributes.position) {
        const posAttr = pGeo.attributes.position;
        for (let i = 0; i < particleCount; i++) {
          posAttr.setX(i, (Math.random() - 0.5) * screenWidth * 1.6);
          posAttr.setY(i, (Math.random() - 0.5) * screenHeight * 1.25);
          posAttr.setZ(i, travelZ + 14 - Math.random() * 75);
        }
        posAttr.needsUpdate = true;
      }
    }

    populateInitialCorridor();

    async function processFiles(files) {

    function extractDriveFolderId(inputStr) {
      const trimmed = inputStr.trim();
      if (!trimmed) return '';

      const folderMatch = trimmed.match(/\/folders\/([a-zA-Z0-9_-]+)/);
      if (folderMatch && folderMatch[1]) {
        return folderMatch[1];
      }

      const idParamMatch = trimmed.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (idParamMatch && idParamMatch[1]) {
        return idParamMatch[1];
      }

      return trimmed.split('?')[0].split('/')[0];
    }

    replayBtn.addEventListener('click', () => {
      populateInitialCorridor();
      statusEl.textContent = "🔄 空間内のアセットを再配置しました！";
    });

    bgBtn.addEventListener('click', () => bgInput.click());
    bgInput.addEventListener('change', (e) => {

    // --- 5. 自動ループ動画エクスポート機能 ---
    const recordBtn = document.getElementById('record-btn');
    const recBadge = document.getElementById('rec-badge');
    const recTimer = document.getElementById('rec-timer');

    let mediaRecorder = null;
    let recordedChunks = [];
    let isAutoRecording = false;
    let autoRecStartTime = 0;
    let currentLoopDuration = 5.0;
    const FIXED_EYE = new THREE.Vector3(0, 0, 14);

    function getSupportedMimeType() {
      const types = [
        'video/mp4;codecs=avc1',
        'video/mp4',
        'video/webm;codecs=vp9',
        'video/webm;codecs=vp8',
        'video/webm'
      ];
      for (const type of types) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(type)) {
          return type;
        }
      }
      return '';
    }

    function startAutoLoopExport() {
      if (!renderer.domElement.captureStream || !window.MediaRecorder) {
        statusEl.textContent = "⚠️ お使いのブラウザはCanvas動画録画に対応していません";
        statusEl.style.color = '#f87171';
        return;
      }

      const seamlessLoopDist = Math.max(GRID_TILE_Z, Math.round((forwardSpeed * 5.0) / GRID_TILE_Z) * GRID_TILE_Z);
      currentLoopDuration = seamlessLoopDist / forwardSpeed;

      travelZ = 0;
      resetEnvironmentPositions(0);
      populateInitialCorridor();

      currentEye.copy(FIXED_EYE);
      updateForwardOffAxisCamera(currentEye, travelZ);
      renderer.render(scene, camera);

      const mimeType = getSupportedMimeType();
      const stream = renderer.domElement.captureStream(60);
      recordedChunks = [];

      try {
        mediaRecorder = mimeType
          ? new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 10000000 })
          : new MediaRecorder(stream, { videoBitsPerSecond: 10000000 });
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream);
      }

      mediaRecorder.ondataavailable = (event) => {
        if (event.data && event.data.size > 0) {
          recordedChunks.push(event.data);
        }
      };

      mediaRecorder.onstop = () => {
        const finalType = mediaRecorder.mimeType || 'video/webm';
        const isMp4 = finalType.includes('mp4');
        const ext = isMp4 ? 'mp4' : 'webm';
        const blob = new Blob(recordedChunks, { type: finalType });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
        a.href = url;
        a.download = `3d-stage-seamless-loop_${timestamp}.${ext}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);

        recordBtn.textContent = "🎬 5秒ループ動画を自動書出";
        recordBtn.classList.remove('recording');
        recBadge.style.display = 'none';
        uiEl.style.opacity = '1';

        statusEl.textContent = `✅ ループ動画（${currentLoopDuration.toFixed(1)}秒）の書出が完了しました！`;
        statusEl.style.color = '#4ade80';
      };

      isAutoRecording = true;
      mediaRecorder.start(200);

      recordBtn.textContent = "⏳ 裏で自動ループ生成中...";
      recordBtn.classList.add('recording');
      uiEl.style.opacity = '0.15';
      recBadge.style.display = 'flex';
      autoRecStartTime = performance.now();

      statusEl.textContent = "🔄 バックグラウンドでループ動画を自動生成中...";
      statusEl.style.color = '#fde047';
    }

    recordBtn.addEventListener('click', () => {

    });

    // --- 6. オフアクシス・カメラワーク ---
    let targetEye = new THREE.Vector3(0, 0, 14);
    let currentEye = new THREE.Vector3(0, 0, 14);

    function updateForwardOffAxisCamera(eyeOffset, windowZ) {
      const near = 0.5;
      const far = 160;
      const left   = -screenWidth / 2;
      const right  =  screenWidth / 2;
      const bottom = -screenHeight / 2;
      const top    =  screenHeight / 2;

      const scale = near / eyeOffset.z;
      camera.projectionMatrix.makePerspective(
        (left   - eyeOffset.x) * scale,
        (right  - eyeOffset.x) * scale,
        (top    - eyeOffset.y) * scale,
        (bottom - eyeOffset.y) * scale,
        near,
        far
      );
      camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();

      camera.position.set(eyeOffset.x, eyeOffset.y, windowZ + eyeOffset.z);
      camera.rotation.set(0, 0, 0);
      camera.updateMatrixWorld();
    }

    let isCameraActive = false;
    window.addEventListener('mousemove', (e) => {
      if (isCameraActive || isAutoRecording) return;
      const nx = (e.clientX / window.innerWidth) * 2 - 1;
      const ny = -(e.clientY / window.innerHeight) * 2 + 1;
      targetEye.set(nx * (screenWidth * 0.45), ny * (screenHeight * 0.4), 14);
    });

    // --- 7. Webカメラ顔追跡 ---
    const startBtn = document.getElementById('start-btn');
    const videoEl = document.getElementById('video-preview');

    startBtn.addEventListener('click', () => {
      startBtn.disabled = true;
      statusEl.textContent = "顔追跡カメラを起動中...";

      const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });
      faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

      faceMesh.onResults((results) => {
        if (isAutoRecording) return;
        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
          const lm = results.multiFaceLandmarks[0];
          const nose = lm[168];
          const eyeX = (0.5 - nose.x) * (screenWidth * 1.15);
          const eyeY = (0.5 - nose.y) * (screenHeight * 1.15);

          const eyeDist = Math.hypot(lm[263].x - lm[33].x, lm[263].y - lm[33].y);
          const eyeZ = Math.max(8, Math.min(24, 2.2 / (eyeDist + 0.01)));
          targetEye.set(eyeX, eyeY, eyeZ);
        }
      });

      const camUtils = new Camera(videoEl, {
        onFrame: async () => { await faceMesh.send({ image: videoEl }); },
        width: 640,
        height: 480
      });

      camUtils.start().then(() => {
        isCameraActive = true;
        videoEl.style.display = 'block';
        startBtn.textContent = "顔追跡オン（横から覗き込めます！）";
      }).catch(() => {
        statusEl.textContent = "カメラ起動エラー";
        startBtn.disabled = false;
      });
    });

    // --- 8. メインアニメーションループ & リサイズ最適化 ---
    const clock = new THREE.Clock();

    window.addEventListener('resize', () => {
      if (isAutoRecording) return;
      metrics = computeScreenMetrics();
      screenWidth = metrics.width;
      screenHeight = metrics.height;

      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      updateEnvironmentGeometry();

      const limitX = screenWidth * 0.55;
      const limitY = screenHeight * 0.45;
      for (const item of activeCutouts) {
        item.targetPos.x = THREE.MathUtils.clamp(item.targetPos.x, -limitX, limitX);
        item.targetPos.y = THREE.MathUtils.clamp(item.targetPos.y, -limitY, limitY);
        if (item.phase === 'staying') {
          item.mesh.position.x = item.targetPos.x;
          item.mesh.position.y = item.targetPos.y;
        }
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);
      const elapsed = clock.getElapsedTime();

      if (isAutoRecording) {
        const elapsedRecTime = (performance.now() - autoRecStartTime) / 1000;
        const clampedTime = Math.min(elapsedRecTime, currentLoopDuration);
        travelZ = -forwardSpeed * clampedTime;

        const remaining = Math.max(0, currentLoopDuration - elapsedRecTime);
        recTimer.textContent = `自動ループ生成中... ${remaining.toFixed(1)}s`;

        if (elapsedRecTime >= currentLoopDuration) {
          mediaRecorder.stop();
          isAutoRecording = false;
        }
      } else {
        travelZ -= forwardSpeed * delta;
      }

      for (const seg of tunnelSegments) {
        if (seg.position.z - TUNNEL_LENGTH > travelZ + currentEye.z + 10) {
          seg.position.z -= TUNNEL_LENGTH * tunnelSegments.length;
        }
      }

      for (const ring of speedRings) {
        if (ring.userData.worldZ > travelZ + currentEye.z) {
          ring.userData.worldZ -= RING_SPAN;
        }
        ring.position.set(0, 0, ring.userData.worldZ);
      }

      backWall.position.z = travelZ - 75;
      if (!isCustomBgImage) {
        backWall.rotation.z = elapsed * 0.15;
      }

      const posAttr = pGeo.attributes.position;
      const halfBoundY = screenHeight * 0.65;
      for (let i = 0; i < particleCount; i++) {
        let px = posAttr.getX(i);
        let py = posAttr.getY(i);
        let pz = posAttr.getZ(i);
        const phase = pPhases[i];

        // 紙吹雪のひらひらとした揺れと緩やかな落下
        px += Math.sin(elapsed * 2.4 + phase) * delta * 1.4;
        py -= (1.6 + (i % 4) * 0.35) * delta;
        if (py < -halfBoundY) {
          py = halfBoundY;
        }

        if (pz > travelZ + currentEye.z) {
          px = (Math.random() - 0.5) * screenWidth * 1.6;
          py = (Math.random() - 0.5) * screenHeight * 1.25;
          pz = travelZ - 55 - Math.random() * 15;
        }

        posAttr.setXYZ(i, px, py, pz);
      }
      posAttr.needsUpdate = true;

      if (isAutoRecording) {
        currentEye.copy(FIXED_EYE);
      } else {
        currentEye.lerp(targetEye, 0.15);
      }
      updateForwardOffAxisCamera(currentEye, travelZ);

      const camZ = camera.position.z;

      for (let i = activeCutouts.length - 1; i >= 0; i--) {
        const item = activeCutouts[i];

        if (item.phase === 'entering') {
          item.mesh.position.x = THREE.MathUtils.lerp(item.mesh.position.x, item.targetPos.x, 0.12);
          item.mesh.position.y = THREE.MathUtils.lerp(item.mesh.position.y, item.targetPos.y, 0.12);
          if (Math.hypot(item.mesh.position.x - item.targetPos.x, item.mesh.position.y - item.targetPos.y) < 0.03) {
            item.mesh.position.x = item.targetPos.x;
            item.mesh.position.y = item.targetPos.y;
            item.phase = 'staying';
          }
        }

        if (item.audioInfo && item.audioInfo.pannerNode) {
          const relX = item.mesh.position.x - camera.position.x;
          const panValue = Math.max(-1, Math.min(1, relX / (screenWidth * 0.5)));
          item.audioInfo.pannerNode.pan.setValueAtTime(panValue, audioCtx ? audioCtx.currentTime : 0);
        }

        if (item.mesh.position.z > camZ - 0.5) {
          if (item.audioInfo) {
            try { item.audioInfo.sourceNode.disconnect(); } catch(e){}
          }
          scene.remove(item.mesh);
          item.mesh.geometry.dispose();
          item.mesh.material.dispose();
          activeCutouts.splice(i, 1);
        }
      }

      const targetFrontLimit = travelZ - SPAWN_DEPTH_END;
      while (furthestSpawnZ > targetFrontLimit && activeCutouts.length < MAX_PEOPLE_ON_SCREEN) {
        furthestSpawnZ -= SLICE_SPACING;
        spawnAssetAtWorldZ(furthestSpawnZ, false);
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
